<!-- GitHub Pages cannot send HTTP headers, so the policy has to travel in the page.
     It is not cosmetic: this app and the Poker Variance Simulator share one origin
     (emreciccio-glitch.github.io), and same-origin script can read the session token,
     the install id and every cached paid chapter out of localStorage. A real fix needs
     a domain of its own. Until then this at least blocks injected third-party script,
     eval, plugins, form posts and page framing, and pins network calls to the backend.
     'unsafe-inline' is unavoidable while all the app code lives inside this file. -->

<body>

</div>

<div class="modal-head"><strong id="chatTitle">AI poker GTO coach</strong><span class="ghost" id="chatCost">1 credit = 1 question</span><span class="cred" id="chatCredBadge" style="margin-left:8px" onclick="openShop()">5</span><button class="modal-x" id="chatClear" style="margin-left:6px" onclick="clearChat()">&#128465;</button><button class="modal-x" onclick="closeChat()">&#10005;</button></div>

<div class="modal-body" id="quizBody"></div>
</div></div>

<script>
// === STATE ===
let lang=localStorage.getItem('lang')||'en',cur='fondamentali',data=null;
const quizDone=JSON.parse(localStorage.getItem('quizDone')||'{}');

// === CREDITS ===
// The server owns the balance; this is the offline mirror. A fresh install used to
// start at an optimistic 5, so an account that gets no welcome grant showed 5 and then
// dropped to 0 as soon as the server replied: it looked like the app had taken them
// away. Unknown now means unknown, and the badge shows a dash until the truth arrives.
let credits=(function(){const v=parseInt(localStorage.getItem('aiCredits'));return Number.isFinite(v)?v:null})();
// The conversation survives app restarts and language switches.

async function sendMsg(){
  if(chatLoading)return;
  const inp=document.getElementById('chatInput');
  const v=inp.value.trim();
  if(!v)return;
  const b=document.getElementById('chatBody');
  const sendBtn=document.getElementById('chatSendBtn');

  // === CHECK CREDITS ===
  // null means the server has not answered yet: let the request through and let the
  // backend decide, rather than blocking a user who may well have credits.
  if(credits!==null&&credits<=0){
    b.innerHTML+=`<div class="no-cred-msg" onclick="closeChat();openShop()">${tr('noCredits')}</div>`;
    b.scrollTop=b.scrollHeight;
    return;
  }

  // Show user message
  b.innerHTML+=`<div class="m u"><div class="bb">${escHtml(v)}</div></div>`;
  inp.value='';
  inp.disabled=true;
  sendBtn.disabled=true;

  // Show typing indicator
  b.innerHTML+=`<div class="m bot" id="typingIndicator"><div class="bb"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  b.scrollTop=b.scrollHeight;
  chatLoading=true;

  try{
    // The credit is charged server side, inside this call
    const json=await api('chat',{message:v,lang,chapter:cur});

    // Remove typing indicator
    const typ=document.getElementById('typingIndicator');
    if(typ)typ.remove();

    const reply=json.reply||'...';
    if(typeof json.credits==='number')setCredits(json.credits);

    // Show bot reply with formatting
    b.innerHTML+=`<div class="m bot"><div class="bb">${formatReply(reply)}</div></div>`;
    b.scrollTop=b.scrollHeight;

    // Update conversation history (keep last 6 for context)
    chatHistory.push({role:'user',content:v});
    chatHistory.push({role:'assistant',content:reply});
    saveChat();


  }catch(err){
    // Remove typing indicator on error
    const typ=document.getElementById('typingIndicator');
    if(typ)typ.remove();

    // 402 = credits finished, 429 = too many requests, anything else = generic error
    if(err&&err.status===402){
      if(typeof err.data.credits==='number')setCredits(err.data.credits);
      b.innerHTML+=`<div class="no-cred-msg" onclick="closeChat();openShop()">${tr('noCredits')}</div>`;
    }else if(err&&err.status===429){
      b.innerHTML+=`<div class="m bot"><div class="bb" style="color:var(--err)">${tr('slowDown')}</div></div>`;
    }else{
      b.innerHTML+=`<div class="m bot"><div class="bb" style="color:var(--err)">\u26a0\ufe0f ${tr('errorMsg')}</div></div>`;
    }
    b.scrollTop=b.scrollHeight;
    console.error('[Chat]',err.message);
  }finally{
    chatLoading=false;
    inp.disabled=false;
    sendBtn.disabled=false;
    inp.focus();
  }
}

// === HELPERS ===
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function formatReply(text){
  // Escape HTML first, then apply lightweight markdown formatting
  let h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Bold
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // Italic
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Inline code
  h=h.replace(/`(.+?)`/g,'<code style="background:var(--sf2);padding:1px 5px;border-radius:4px;font-size:.76rem;font-family:JetBrains Mono,monospace">$1</code>');
  // Bullet lists (lines starting with - )
  h=h.replace(/^- (.+)$/gm,'<span style="display:block;padding-left:12px">\u2022 $1</span>');
  // Line breaks
  h=h.replace(/\n/g,'<br>');
  return h;
}

const billing={service:null,method:null,store:null,ready:false,price:{},online:false};

// Anonymous, per-install identifier. Paired server side with an account id.
function installId(){
  let v=localStorage.getItem('installId');
  if(!v){
    v=(self.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2,12));
    localStorage.setItem('installId',v);
  }
  return v;
}
let sid=localStorage.getItem('sid')||'';
let sessionRetryAfter=0;

async function api(path,payload,retried){
  const res=await fetch(API_BASE+'/'+path,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    // installId travels with every call: the session token is bound to this device,
    // so a copied token is useless somewhere else.
    body:JSON.stringify(Object.assign({sid,installId:installId()},payload||{}))
  });
  const json=await res.json().catch(()=>({}));
  if(!res.ok){
    // A rejected session is recoverable: build a new one and try again once.
    // Happens after the device binding was introduced, or when a token is revoked.
    // The cooldown matters: if the backend keeps refusing (rotated secret, database
    // down) every user action would otherwise cost two requests forever and the app
    // would feel hung while quietly hammering the server.
    if(res.status===401&&!retried&&path!=='session'&&Date.now()>sessionRetryAfter){
      sid='';localStorage.removeItem('sid');
      await startSession();
      if(sid)return api(path,payload,true);
      sessionRetryAfter=Date.now()+30000;
    }
    const e=new Error(json.error||('http '+res.status));e.status=res.status;e.data=json;throw e;
  }
  return json;
}

// Entitlements: authoritative copy is on the server, this is the offline cache.
const owned=Object.assign({pro:false,elite:false},JSON.parse(localStorage.getItem('owned')||'{}'));
function saveOwned(){localStorage.setItem('owned',JSON.stringify(owned))}

function hasAccess(k){
  if(!data)return false;
  if(data.structure.pro.includes(k))return owned.pro;
  if(data.structure.elite.includes(k))return owned.elite;
  return true;
}
// The PRO+ELITE bundle disappears as soon as PRO or ELITE has been purchased
function bundleAvailable(){return !owned.pro && !owned.elite}
function priceOf(sku){
  if(billing.price[sku])return billing.price[sku];
  // No billing service on this platform, e.g. the site opened in a desktop browser.
  // A placeholder there promises a price that is never coming and makes the shop look
  // broken; the notice at the bottom already says purchases live in the Play app.
  if(billing.ready&&!billing.service)return '';
  return PRICE_PENDING;
}

function applyServerState(j){
  // The server can hand back a different account: it happens when a permanent
  // receipt proves this device already paid, after a wipe or on a new phone.
  if(j.sid&&j.sid!==sid){
    sid=j.sid;
    try{localStorage.setItem('sid',sid)}catch(e){/* quota */}
  }
  if(typeof j.credits==='number'){
    credits=j.credits;
    localStorage.setItem('aiCredits',String(credits)); // cache for offline display only
  }
  // The backend caps brand new free accounts per address, so several people on one
  // wifi or behind the same mobile carrier can arrive with no welcome credits. Saying
  // so once beats a silent zero that reads as a broken app.
  if(j.capped&&!localStorage.getItem('cappedSeen')){
    try{localStorage.setItem('cappedSeen','1')}catch(e){}
    setTimeout(()=>toast(tr('cappedMsg')),1200);
  }
  // Entitlement lost (refund, chargeback): drop the cached paid text as well.
  // Leaving it behind means the chapters stay readable offline by flipping a flag.
  const lost=('pro' in j&&owned.pro&&!j.pro)||('elite' in j&&owned.elite&&!j.elite);
  if('pro' in j)owned.pro=!!j.pro;
  if('elite' in j)owned.elite=!!j.elite;
  if(lost){
    Object.keys(paidCache).forEach(k=>delete paidCache[k]);
    try{localStorage.removeItem('paidBodies')}catch(e){}
  }
  saveOwned();updateCreditsUI();renderSide();render();
}

// Your own test unlock: open the app once with ?test=YOURCODE (the code you set
// in TEST_UNLOCK_CODE on the backend). It is stored locally and reused. Users
// cannot guess it, and without it nothing can be unlocked for free.
// The unlock code used to be stored forever: opening the link once on a borrowed
// phone left it unlocked for good, and the code sat in plain sight in storage.
// Now it expires, and ?test= with no value turns it off.
const TEST_CODE_TTL=14*24*3600*1000;
function testCode(){
  const q=new URLSearchParams(location.search);
  if(q.has('test')){
    const v=q.get('test');
    if(v){
      try{localStorage.setItem('testCode',JSON.stringify({v,exp:Date.now()+TEST_CODE_TTL}))}catch(e){}
    }else{
      localStorage.removeItem('testCode');
    }
    // Drop the stored session so the code is applied to a fresh one
    localStorage.removeItem('sid');sid='';
    // Wipe the code out of the address bar the moment it has been read. Left there
    // it survives in the TWA's history, in the share sheet, in the recents preview
    // and in every screenshot of the app: the one link that unlocks everything.
    try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  }
  const raw=localStorage.getItem('testCode');
  if(!raw)return '';
  try{
    const o=JSON.parse(raw);
    if(o&&o.v&&o.exp>Date.now())return o.v;
    localStorage.removeItem('testCode');
    return '';
  }catch(e){
    // Legacy plain string from before the expiry existed: retire it.
    localStorage.removeItem('testCode');
    return '';
  }
}

async function startSession(){
  try{
    const j=await api('session',{installId:installId(),testCode:testCode()});
    if(j.sid){sid=j.sid;localStorage.setItem('sid',sid)}
    billing.online=true;
    applyServerState(j);
  }catch(e){
    // Offline or backend down: keep the cached entitlements so paid chapters
    // already downloaded stay readable. Credits cannot be spent without network.
    billing.online=false;
    console.warn('session unavailable',e.message);
  }
}

async function initBilling(){
  await startSession();
  if(typeof window.getDigitalGoodsService==='function'){
    for(const st of STORES){
      try{
        const svc=await window.getDigitalGoodsService(st.method);
        if(svc){billing.service=svc;billing.method=st.method;billing.store=st.store;break}
      }catch(e){/* not the store hosting this app */}
    }
  }
  if(billing.service){
    await loadStorePrices();
    await restorePurchases(true);
  }
  billing.ready=true;
  renderSide();render();
}

// Real localized prices from the store listing
async function loadStorePrices(){
  try{
    const items=await billing.service.getDetails(Object.values(SKU));
    items.forEach(it=>{
      try{
        billing.price[it.itemId]=new Intl.NumberFormat(navigator.language||'en',{style:'currency',currency:it.price.currency}).format(Number(it.price.value));
      }catch(e){billing.price[it.itemId]=it.price.value+' '+it.price.currency}
    });
  }catch(e){console.warn('getDetails failed',e)}
}

// Sends every receipt held by the store account to the backend. Idempotent:
// the server grants credits only on the first redemption of each receipt.
async function restorePurchases(silent){
  if(!billing.service){if(!silent)toast(tr('storeOnly'));return}
  let restored=0,rejected=false,recovered=false;
  try{
    const purchases=await billing.service.listPurchases();
    for(const pur of purchases){
      try{
        const j=await api('redeem',{store:billing.store,itemId:pur.itemId,purchaseToken:pur.purchaseToken,installId:installId()});
        applyServerState(j);
        if(j.granted)restored++;
        if(j.recovered)recovered=true;
        // Consumable already credited: consume it so it can be bought again
        if(CONSUMABLES.includes(pur.itemId)){
          try{await billing.service.consume(pur.purchaseToken)}catch(e){console.warn('consume failed',e)}
        }
      }catch(e){
        if(e.status===409)rejected=true; // receipt bound to another account
        else console.warn('redeem failed',e.message);
      }
    }
  }catch(e){console.warn('listPurchases failed',e)}
  if(!silent)toast(recovered?tr('restoreOk'):(rejected?tr('receiptUsed'):(restored?tr('restoreOk'):tr('restoreNone'))));
  if(document.getElementById('shopModal').classList.contains('open'))openShop();
}

async function purchase(key){
  const sku=SKU[key];
  if(!sku)return;
  if(!billing.service||!window.PaymentRequest)return toast(tr('storeOnly'));
  if(!sid)await startSession();
  if(!sid)return toast(tr('needNet'));
  try{
    const request=new PaymentRequest(
      [{supportedMethods:billing.method,data:{sku}}],
      {total:{label:'Total',amount:{currency:'EUR',value:'0'}}} // the store applies its own price
    );
    try{
      if(request.canMakePayment){
        const can=await request.canMakePayment();
        if(can===false)console.warn('canMakePayment said no, trying anyway');
      }
    }catch(e){console.warn('canMakePayment unavailable',e&&e.name)}
    const response=await request.show();
    const token=(response.details&&(response.details.token||response.details.purchaseToken))||'';
    let ok=false;
    try{
      // The server validates the receipt with the store, binds it to this account
      // and only then grants credits or unlocks chapters.
      const j=await api('redeem',{store:billing.store,itemId:sku,purchaseToken:token,installId:installId()});
      ok=true;
      applyServerState(j);
      if(CONSUMABLES.includes(sku)&&token){
        try{await billing.service.consume(token)}catch(e){console.warn('consume failed',e)}
      }
    }catch(e){
      toast(e.status===409?tr('receiptUsed'):tr('purchaseFailed'));
    }
    await response.complete(ok?'success':'fail');
    if(ok)openShop();
  }catch(e){
    if(e&&e.name!=='AbortError'){
      console.warn(e);
      const detail=(e.name||'Error')+(e.message?(': '+e.message):'');
      toast(window.PG_DEBUG?(tr('purchaseFailed')+' \u2014 '+detail):tr('purchaseFailed'));
    }
  }
}

// === SHOP UI ===
function openShop(){
  let h=`<div class="sl">${tr('chapterPacks')}</div>`;
  if(owned.pro&&owned.elite){
    h+=`<div class="si owned"><div class="a">${tr('ownedAll')}<small>${tr('freeTier')}</small></div><div class="p">${tr('owned')}</div></div>`;
  }else{
    if(owned.pro){h+=`<div class="si owned"><div class="a">${tr('unlockPro')}<small>${tr('proPack')}</small></div><div class="p">${tr('owned')}</div></div>`}
    else{h+=`<div class="si" onclick="purchase('pro')"><div class="a">${tr('unlockPro')}<small>${tr('proPack')} ${tr('proCredits')}</small></div><div class="p">${priceOf(SKU.pro)}</div></div>`}
    if(owned.elite){h+=`<div class="si owned"><div class="a">${tr('unlockElite')}<small>${tr('elitePack')}</small></div><div class="p">${tr('owned')}</div></div>`}
    else{h+=`<div class="si" onclick="purchase('elite')"><div class="a">${tr('unlockElite')}<small>${tr('elitePack')} ${tr('eliteCredits')}</small></div><div class="p">${priceOf(SKU.elite)}</div></div>`}
    if(bundleAvailable()){
      h+=`<div class="si best" onclick="purchase('bundle')"><div class="a">${tr('unlockAll')}<small>${tr('allPack')} ${tr('allCredits')}</small></div><div class="p">${priceOf(SKU.bundle)}</div></div>`;
      h+=`<div class="shop-note">${tr('bundleNote')}</div>`;
    }
  }
  h+=`<div class="sl">${tr('creditsPack')}</div>`;
  h+=`<div class="si" onclick="purchase('c15')"><div class="a">15 ${tr('credits')}<small>Launch</small></div><div class="p">${priceOf(SKU.c15)}</div></div>`;
  h+=`<div class="si" onclick="purchase('c40')"><div class="a">40 ${tr('credits')}<small>Best value</small></div><div class="p">${priceOf(SKU.c40)}</div></div>`;
  h+=`<div class="si" onclick="purchase('c120')"><div class="a">120 ${tr('credits')}<small>Pro pack</small></div><div class="p">${priceOf(SKU.c120)}</div></div>`;

  else if(billing.ready)h+=`<div class="shop-warn">${tr('storeOnly')}</div>`;
  document.getElementById('shopBody').innerHTML=h;
  document.getElementById('shopTitle').textContent=tr('shopTitle');
  document.getElementById('shopModal').classList.add('open');
}
function closeShop(){document.getElementById('shopModal').classList.remove('open')}

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('on');
  clearTimeout(window._toastT);
  window._toastT=setTimeout(()=>t.classList.remove('on'),3200);
}

// ==========================================================
// === PAID CHAPTER CONTENT (served only to owners) ===
// ==========================================================
// Paid bodies are not in the public chapters.json. They are fetched per chapter
// after the server checks the entitlement, then cached for offline reading.
const paidCache=JSON.parse(localStorage.getItem('paidBodies')||'{}');
let paidLoading=null;

const paidError={};
function paidBody(id){return paidCache[id+':'+lang]||null}
function paidNotice(id){const k=id+':'+lang;const m=paidError[k];if(!m)return null;delete paidError[k];return '<p style="text-align:center;color:var(--tx3);padding:26px">'+m+'</p>'}

async function fetchPaidBody(id){
  if(paidLoading===id+':'+lang)return;
  paidLoading=id+':'+lang;
  try{
    if(!sid)await startSession();
    const j=await api('chapter',{id,lang});
    paidCache[id+':'+lang]=j.body;
    if(j.quiz){
      if(!data.quiz)data.quiz={};
      data.quiz[id]=data.quiz[id]||{};
      data.quiz[id][lang]=j.quiz;
    }
    try{localStorage.setItem('paidBodies',JSON.stringify(paidCache))}catch(e){/* quota */}
  }catch(e){
    // Never cache the failure: otherwise the chapter stays broken even once the
    // backend is back. Show the notice for this render only.
    console.warn('chapter load failed',e.message);
    paidError[id+':'+lang]=(e.status===403)?tr('needNet'):(e.status?tr('errorMsg'):tr('needNet'));
  }finally{
    paidLoading=null;
    render();
  }
}

// === GLOSSARY ===
function glossaryList(){
  if(!data||!data.glossary)return[];
  return data.glossary[lang]||data.glossary.en||data.glossary.it||[];
}

// Renders only the entries matching the query. Search runs on term and definition.
function renderGlossary(q){
  const g=glossaryList();
  const needle=(q||'').trim().toLowerCase();
  const rows=needle
    ? g.filter(([t,d])=>String(t).toLowerCase().includes(needle)||String(d).toLowerCase().includes(needle))
    : g;
  const box=document.getElementById('glossaryList');
  if(!box)return;
  if(!rows.length){
    box.innerHTML=`<p style="text-align:center;color:var(--tx3);padding:18px">${tr('noResults')}</p>`;
    return;
  }
  box.innerHTML=rows.map(([t,d])=>`<div style="margin-bottom:10px"><strong style="color:var(--ac)">${escHtml(String(t))}</strong><br><span style="color:var(--tx2);font-size:.84rem">${escHtml(String(d))}</span></div>`).join('');
}

function showGlossary(){
  if(!data||!data.glossary)return;
  document.getElementById('quizBody').innerHTML=
    `<input class="gl-search" id="glossarySearch" type="search" autocomplete="off" placeholder="${tr('searchTerm')}" oninput="renderGlossary(this.value)">`
    +`<div id="glossaryList"></div>`;
  document.getElementById('quizTitle').textContent=tr('glossary');
  document.getElementById('quizModal').classList.add('open');
  renderGlossary('');
}

// === QUIZ ===
let quizActive=false,quizBackup='';

// Etichette non presenti in T{}, gestite localmente come le altre stringhe inline del quiz
function qlbl(key){
  const L={
    exit:{it:'Esci',en:'Exit',es:'Salir',de:'Verlassen',fr:'Quitter'},
    cont:{it:'Continua',en:'Continue',es:'Continuar',de:'Weiter',fr:'Continuer'},
    retry:{it:'Riprova',en:'Retry',es:'Reintentar',de:'Erneut versuchen',fr:'Réessayer'},
    repeat:{it:'Ripeti',en:'Repeat',es:'Repetir',de:'Wiederholen',fr:'Refaire'},
    wrong:{it:'Risposta sbagliata! Devi ricominciare.',en:'Wrong answer! Start over.',es:'¡Respuesta incorrecta! Debes empezar de nuevo.',de:'Falsche Antwort! Von vorne beginnen.',fr:'Mauvaise réponse ! Recommence.'},
    perfect:{it:'Perfetto! Capitolo completato.',en:'Perfect! Chapter completed.',es:'¡Perfecto! Capítulo completado.',de:'Perfekt! Kapitel abgeschlossen.',fr:'Parfait ! Chapitre terminé.'}
  };
  return (L[key]&&(L[key][lang]||L[key].en))||key;
}

function confirmCloseQuiz(){
  if(!quizActive){document.getElementById('quizModal').classList.remove('open');return}
  quizBackup=document.getElementById('quizBody').innerHTML;
  document.getElementById('quizBody').innerHTML=`<div class="confirm-box"><p>${tr('quizConfirm')}</p><button onclick="quizActive=false;document.getElementById('quizModal').classList.remove('open')">${qlbl('exit')}</button><button class="primary" onclick="document.getElementById('quizBody').innerHTML=quizBackup">${qlbl('cont')}</button></div>`;
}

// Fisher-Yates. The old code used [...arr].sort(()=>Math.random()-0.5), which is the
// classic broken shuffle: a sort comparator must be consistent, and a random one is
// not, so the engine's sort leaves a heavy bias. Measured over 200k runs with four
// options, the correct answer landed in slot 1 or 2 about 66% of the time and in the
// last slot only 12.6%, where a fair shuffle gives 25% each. Someone who always taps
// the first option beats chance, which quietly makes every quiz easier than intended.
function shuffled(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(chapter){
  if(!data)return;
  const pool=quizPool(chapter);
  if(!pool)return;
  const numQ=quizSize[chapter]||8;
  const questions=shuffled(pool).slice(0,Math.min(numQ,pool.length));
  window._quizState={chapter,questions,total:questions.length,current:0,score:0,locked:false};
  quizActive=true;
  quizBackup='';
  document.getElementById('quizTitle').textContent='Quiz: '+clabel(chapter);
  document.getElementById('quizModal').classList.add('open');
  showQuizQuestion();
}

function showQuizQuestion(){
  const state=window._quizState;
  if(!state)return;
  state.locked=false;
  const qi=state.current;
  const q=state.questions[qi];
  const correctAnswer=q.options[q.answer];
  const opts=shuffled(q.options);
  let h='<p style="text-align:center;color:var(--tx3);font-size:.76rem;margin-bottom:14px">'+(qi+1)+'/'+state.total+'</p>';
  h+='<div class="quiz-q"><p>'+q.question+'</p>';
  opts.forEach(opt=>{
    h+='<button class="quiz-o" data-correct="'+(opt===correctAnswer)+'" onclick="quizAnswer(this)">'+opt+'</button>';
  });
  h+='</div>';
  document.getElementById('quizBody').innerHTML=h;
}

function quizAnswer(btn){
  const state=window._quizState;
  if(!state||state.locked)return;
  state.locked=true;
  const qq=btn.parentElement;
  const isCorrect=btn.getAttribute('data-correct')==='true';
  const buttons=qq.querySelectorAll('.quiz-o');
  buttons.forEach(b=>{b.style.pointerEvents='none'});

  if(!isCorrect){
    btn.classList.add('wrong');
    quizActive=false;
    setTimeout(()=>{
      document.getElementById('quizBody').innerHTML='<div class="confirm-box"><p>'+qlbl('wrong')+'</p><button class="primary" onclick="startQuiz(\''+state.chapter+'\')">\ud83d\udd01 '+qlbl('retry')+'</button><button onclick="document.getElementById(\'quizModal\').classList.remove(\'open\')">'+tr('close')+'</button></div>';
    },800);
    return;
  }

  btn.classList.add('correct');
  state.score++;
  state.current++;

  if(state.current>=state.total){
    quizActive=false;
    quizDone[state.chapter]=true;
    localStorage.setItem('quizDone',JSON.stringify(quizDone));
    setTimeout(()=>{
      document.getElementById('quizBody').innerHTML='<div class="confirm-box"><p style="font-size:1.2rem;font-weight:700">'+state.total+'/'+state.total+' \ud83c\udfaf</p><p>'+qlbl('perfect')+'</p><button class="primary" onclick="startQuiz(\''+state.chapter+'\')">\ud83d\udd01 '+qlbl('repeat')+'</button><button onclick="document.getElementById(\'quizModal\').classList.remove(\'open\')">'+tr('close')+'</button></div>';
      render();
    },600);
  }else{
    setTimeout(()=>showQuizQuestion(),600);
  }
}

async function init(){
  try{
    const res=await fetch('chapters.json');
    data=await res.json();
    document.getElementById('langSel').value=lang;
    applyUI();
    initBilling();
  }catch(e){
    document.getElementById('main').innerHTML='<p style="padding:40px;text-align:center;color:var(--tx3)">Error loading chapters.json</p>';
    console.error(e);
  }
}
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var sw = reg.installing;
        if (sw) sw.addEventListener('statechange', function () {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) sw.postMessage('skipWaiting');
        });
      });
    }).catch(function () { /* offline mode unavailable, the app still works online */ });
  });
  var swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swReloaded) return; swReloaded = true; location.reload();
  });
}
